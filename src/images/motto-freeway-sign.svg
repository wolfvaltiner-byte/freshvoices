<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="fv-motto-title">
  <title id="fv-motto-title">Kalifornisches Freeway-Schild: Let your mind go and your body will follow</title>

  <!-- night-sky star scatter, echoing the brand's green dot cloud — confined to the
       22px clearance above the sign so it never touches the sign body -->
  <g fill="#91C268" opacity="0.6">
    <circle cx="26" cy="14" r="1.5"/>
    <circle cx="58" cy="8" r="1.2"/>
    <circle cx="92" cy="17" r="1.6"/>
    <circle cx="150" cy="6" r="1.3"/>
    <circle cx="228" cy="11" r="1.5"/>
    <circle cx="268" cy="18" r="1.2"/>
    <circle cx="296" cy="9" r="1.6"/>
  </g>

  <!-- posts, anchored under the (now wider) sign -->
  <g stroke="#8A8A8A" stroke-width="4" stroke-linecap="round">
    <line x1="122" y1="162" x2="118" y2="192"/>
    <line x1="198" y1="162" x2="202" y2="192"/>
  </g>

  <!-- sign body: 280x140, 22px top clearance for the stars, 16px inner padding -->
  <rect x="20" y="22" width="280" height="140" rx="12" fill="#1E6B3C" stroke="#FFFFFF" stroke-width="3"/>

  <!-- header row: small interstate-shaped accent badge + "EXIT", its own line so it
       never collides with the headline below -->
  <path d="M36 38 h16 v8 l-8 8 l-8 -8 z" fill="#FF63A1"/>
  <text x="58" y="49" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="9"
        letter-spacing="1" fill="#FFFFFF" textLength="24" lengthAdjust="spacingAndGlyphs">EXIT</text>

  <!-- headline, two lines, each width-capped at 240px via textLength so no
       fallback font (e.g. Arial where Montserrat hasn't loaded) can blow the line
       past the sign's inner width -->
  <text x="160" y="92" text-anchor="middle" font-family="Montserrat, Arial, sans-serif"
        font-weight="800" font-size="21" fill="#FFFFFF" letter-spacing="0.4"
        textLength="236" lengthAdjust="spacingAndGlyphs">LET YOUR MIND GO</text>
  <text x="160" y="114" text-anchor="middle" font-family="Montserrat, Arial, sans-serif"
        font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="0.4"
        textLength="210" lengthAdjust="spacingAndGlyphs">AND YOUR BODY WILL FOLLOW</text>

  <!-- directional arrow, its own row bottom-right, well clear of both text lines above
       (a prior draft had the arrow tip level with line 2's baseline, which visually
       collided with "FOLLOW" — this row sits a full 12px below line 2's descender) -->
  <path d="M252 146 L273 125 M273 125 L273 135 M273 125 L263 125"
        fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
