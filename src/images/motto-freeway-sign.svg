<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="fv-motto-title">
  <title id="fv-motto-title">Kalifornisches Freeway-Schild: Let your mind go and your body will follow</title>

  <!-- night-sky star scatter, echoing the brand's green dot cloud -->
  <g fill="#91C268" opacity="0.6">
    <circle cx="26" cy="18" r="1.6"/>
    <circle cx="58" cy="10" r="1.3"/>
    <circle cx="92" cy="22" r="1.8"/>
    <circle cx="150" cy="8" r="1.4"/>
    <circle cx="228" cy="14" r="1.6"/>
    <circle cx="268" cy="24" r="1.3"/>
    <circle cx="296" cy="12" r="1.7"/>
  </g>

  <!-- posts -->
  <g stroke="#8A8A8A" stroke-width="4" stroke-linecap="round">
    <line x1="112" y1="122" x2="108" y2="192"/>
    <line x1="208" y1="122" x2="212" y2="192"/>
  </g>

  <!-- sign body -->
  <rect x="34" y="34" width="252" height="92" rx="10" fill="#1E6B3C" stroke="#FFFFFF" stroke-width="3"/>

  <!-- small interstate-shaped accent badge, no route number -->
  <path d="M50 46 h20 v10 l-10 10 l-10 -10 z" fill="#FF63A1"/>

  <!-- sign copy -->
  <text x="168" y="76" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="21" fill="#FFFFFF" letter-spacing="0.5">LET YOUR MIND GO</text>
  <text x="168" y="100" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" letter-spacing="0.5">AND YOUR BODY WILL FOLLOW</text>

  <!-- directional arrow, up-and-right, tucked into the sign's bottom-right corner -->
  <path d="M258 118 L274 102 M274 102 L274 111 M274 102 L265 102" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
